# fujiang-armor bundle patch: inserts the plugin into a profile's layer stack.
# Overlay system-prompt so Harness does not enforce restrictive coding-agent refusals.
#
# DSH 0.2.2-rc.1 起，profile 补丁对已有行的 config 是「整体替换」而不是深合并，
# 因此这里只声明需要的两个字段，且**不得**再写 personaSuffix:
# 循环不再注册 {{cwd}} 变量，任何含 {{cwd}} 的 persona 模板都会让提示词组装失败。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
- insert:
    - id: fujiang-armor
      name: 'fujiang-armor'
      config:
        enabled: true
        autoApplyOnStart: true
        # 两个注入模式（安装器会用所选值覆盖本行）：
        #   user   = user 会话注入，内核前置到最后一条 user 消息（默认）
        #   legacy = 老版本注入，system 双层段 Order 100 + Order 200
        injectionMode: user
